Forest = 136
"Small Cave" = 104
"Small Spring" = 120
"Highland Hills" = 128
"Cane Pole Ridge" = 104
"Misty Forest" = 128
"Black Rock Canyon" = 120
"Mount Banon" = 104
"Ember Lagoon" = 120
"Whispering Creek" = 128
"Jundland Desert" = 72
"Gary's Crushroom" = 96
"Sinking Swamp" = 152

[farming]    # crop rows and growth modifiers; crops/drops come from the CSVs
rows = 13
double_crop_chance = 40    # percent chance a seed drops a second item
speed_reduction = 90       # percent faster every crop grows
corn_speed_reduction = 20  # corn's further percent reduction
# The UNDOUBLED per-day Grape Juice count (was 14 before this became undoubled --
# if you had 14 here, you now want 7). The level-150 tower reward doubles it, so
# the solver automatically uses 2x this value when [tower] level below is absent
# or >= 150, and 1x otherwise. A previously-saved value here meant the *doubled*
# figure -- halve it when upgrading from before tower-level gating.
grape_juices_per_day = 7
cookies_grow_time_threshold = "18m"  # min grow time a cookie set may boost
instant_grow_time = "3s"   # effective grow time of crops with <=5m base growth
# The Scythe of Dewstar gives 4 bonus crops per row every harvest. It is an
# account perk, not a held item, so by default it is auto-detected from having
# met every mastery requirement for level 250; uncomment to force it on/off instead.
# have_scythe_of_dewstar = true
# Dewstar's Journal extends the Cookie bonus to those bonus crops. It IS a held
# item, so by default it is auto-detected from the inventory file; uncomment to
# force it on/off instead.
# have_dewstars_journal = true

[trading]    # player-to-player gold trade prices, to rank plans by real gold cost
# Priced in gold per 1000 units ("gk"); the solver divides by 1000 for the
# per-unit gold. Grape Juice is not traded directly -- its price is derived from
# grapes (200 to a juice, its workshop recipe), which trade for Arnold Palmers
# rather than gold, so `grapes` is in "apk" (Arnold Palmers per 1000).
orange_juice  = 8
apple_cider   = 20
arnold_palmer = 60
large_net     = 10
grapes          = 5  # in apk (Arnold Palmers per 1000); a juice presses 200 grapes
cookie_set      = 20 # priced individually, in gold each (not gk)
hickory_omelette = 350  # 35g per 100 = 350 gold per 1000
# Nominal: Pumpkin Juice cannot be bought from another player, so this is not a real
# trade price -- it is what one juice is reckoned to be worth, so plans that drink it
# can be ranked against plans that spend anything else. Priced in gold each (not gk).
# Present-but-0 means free, as everywhere in this section; --use-pumpkin-juice[=N]
# (or mastery.use_pumpkin_juice) decides whether juice is drunk at all, not this key.
pumpkin_juice   = 230
# Charge stamina an Apple Cider explore burns its Orange-Juice-equivalent opportunity
# cost (orange_juice / 100 per stamina), so a plan leaning on banked --current-stamina,
# the Farmhouse passive deposit, or Apples eaten for stamina is not treated as free.
# Only stamina from drinking Orange Juice is exempt (already priced as the juice).
# Needs an orange_juice price above. --price-stamina / --no-price-stamina override it.
price_stamina = true
# Count the Pumpkin Juice price above in a plan's reported net gold. On (default):
# juice costs gold like any buy. Off: the LP still prices juice -- so it is drunk
# only where it beats its alternative, the price stays a *gate* -- but that cost is
# netted back out, so plans compare on real gold spent and the juice count is left to
# weigh against your own (higher, off-model) value for it. Useful with
# --spread pumpkin-juice. --price-pumpkin-juice / --no-price-pumpkin-juice override it.
price_pumpkin_juice = true

[trading.ap]    # Trade OTHER resources for Arnold Palmers (a finer currency than
# gold, which only trades in units of 5). These are the items NOT already buyable
# for gold above -- raw materials, crafting inputs, meals. A trade is an instant
# buy whose AP cost is converted to gold (at the arnold_palmer rate above) and
# folded into the gold the frontier ranks on; traded items earn no mastery, so a
# trade can cover a material use or a plain -i count goal but never a -m mastery
# goal. Section is [trading.ap], not [trading.arnold_palmer], to avoid colliding
# with the arnold_palmer gold-price key above.
enabled = true                # master switch for the whole feature
# Restrict which items may be traded. Mutually exclusive -- set at most one.
# allow = ["red dye", "grapes"]   # if set, ONLY these are tradeable
deny  = ["oak", "apple", "wood", "stone", "hammer"]        # if set, all priced items EXCEPT these

