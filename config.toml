# Apple Cider perks/meals (inventory plan mode). Cinnamon Sticks raises explores
# per cider; wanderer_level (1=4%, 2=11%, 3=20%, 4=33%), the Neigh Neigh perk and
# the Neigh meal each cut the stamina a cider explore costs, multiplicatively.
have_cinnamon_sticks = true
wanderer_level = 4
have_neigh_neigh = true
use_neigh = true

