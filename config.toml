[mastery]    # Pumpkin Juice: a bought item that instantly boosts one mastery goal
# by 10% of its tier. Off by default; --use-pumpkin-juice[=N] overrides this.
# `true` lets the solver use any number, an integer caps the total, `false` is off.
use_pumpkin_juice = false
# Its nominal gold cost lives with the other prices, as `trading.pumpkin_juice`.

[workshop]    # Resource Saver perk: how many items an average craft yields
# 1 -> 1.10, 2 -> 1.25, 3 -> 1.45 crafting bonus. The level-90 tower reward
# upgrades a configured 2 to 3 automatically once [tower] level below reaches 90
# (below it 3 isn't ownable yet, so a configured 3 is capped back to 2).
resource_saver = 3

# Current tower level -- gates which level-tied rewards (Resource Saver 3 at 90,
# doubled Grape Juice at 150, ...) the solver assumes are actually owned. Leave
# commented / absent to assume every level-gated reward is owned (today's
# behaviour, unchanged). A later "ascension" mode will climb this mid-solve; for
# now it is a fixed starting point. `ascension_knowledge` will live in this
# section too (not yet a recognised key).
# [tower]
# level = 250

[frontier]    # spread the shown frontier plans along a chosen axis instead of the
# default time-thin, and/or render an impact graph alongside the table. Both
# are off by default (unchanged behaviour); --spread/--graph on the command
# line override these.
#   spread        AXIS or "AXIS=LO:HI" -- axis is one of time / gold /
#                 pumpkin-juice (alias pj) / passive; LO:HI narrows the
#                 sampled range (ignored for passive, which enumerates its
#                 own breakpoints instead of sampling one).
# spread = "pumpkin-juice"
#   spread_range  [LO, HI] -- fills in the range when spread above names an
#                 axis with no range of its own (an explicit "AXIS=LO:HI"
#                 always wins over this).
# spread_range = [0, 10]
#   graph         "auto" (the natural counterpart of the spread axis --
#                 gold, or time when spreading by gold), "gold", or "time" --
#                 renders a secondary-metric-vs-axis plot under the frontier
#                 table (ASCII in the terminal, an interactive SVG on the web).
# graph = "gold"

